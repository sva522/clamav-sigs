name: Pipeline

on:
  #schedule:
  #  - cron: "0 3 * * 6" # Every saturday at 3 am
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Launch script
        timeout-minutes: 15
        run: bash pipeline.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
